<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Otázky a odpovede pre autoškolu, skupina B.">
    <title>Autoškola B — otázky a odpovede</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="page-width">
        <div class="header-row">
          <div>
            <p class="eyebrow">Skupina B</p>
            <h1>Otázky a odpovede</h1>
            <p id="question-count" class="subtitle">Načítavam otázky…</p>
          </div>
          <button id="menu-button" class="back-button" type="button" hidden>Menu</button>
        </div>
      </div>
    </header>

    <main class="page-width">
      <section id="topic-menu" class="topic-menu" aria-labelledby="menu-title">
        <p class="menu-kicker">Vyber si okruh</p>
        <h2 id="menu-title">Čo si chceš prečítať?</h2>
        <p class="menu-description">Otázky a odpovede sú zoradené rovnako ako v pôvodnom PDF.</p>
        <div id="topic-buttons" class="topic-buttons"></div>
      </section>
      <section id="reading-toolbar" class="reading-toolbar" hidden aria-label="Postup v okruhu">
        <div class="reading-toolbar-top">
          <strong id="active-topic"></strong>
          <span id="progress-label"></span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </section>
      <div id="question-list" class="question-list" aria-live="polite"></div>
      <p class="source-note">Digitálna verzia otázok z priloženého PDF. Červenou prečiarknuté položky sú vynechané.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
